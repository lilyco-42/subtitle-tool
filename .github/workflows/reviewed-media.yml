name: Subtitle reviewed media
on:
  pull_request:
    paths: ['desktop/packaging/media-build.py', 'desktop/packaging/media-plan.py', 'desktop/tests/media_smoke.py', '.github/workflows/reviewed-media.yml']
  push:
    branches: [master]
    paths: ['desktop/packaging/media-build.py', 'desktop/packaging/media-plan.py', 'desktop/tests/media_smoke.py', '.github/workflows/reviewed-media.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: subtitle-reviewed-media-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reuse: ${{ steps.plan.outputs.reuse }}
      source_run: ${{ steps.plan.outputs.source_run }}
      artifact_commit: ${{ steps.plan.outputs.artifact_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare actual existing producer source and successful compilation jobs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python desktop/packaging/media-plan.py
  compile-media:
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [linux64, win64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original FFmpeg plus exact dependency sources, compile only in Actions
        run: python desktop/packaging/media-build.py --target ${{ matrix.target }}
      - name: Preserve binary and complete corresponding sources together
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-media-${{ matrix.target }}-${{ github.sha }}
          path: desktop/media-output/${{ matrix.target }}.tar.gz
          if-no-files-found: error
      - name: Preserve failed source-build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-media-failure-${{ matrix.target }}-${{ github.sha }}
          path: |
            desktop/media-build/${{ matrix.target }}/builder/Dockerfile
            desktop/media-build/${{ matrix.target }}/builder/ffbuild/ffmpeg/ffbuild/config.log
          if-no-files-found: warn
  verify-media:
    needs: [plan, compile-media]
    if: always() && needs.plan.result == 'success' && (needs.compile-media.result == 'success' || needs.compile-media.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux64
          - os: windows-latest
            target: win64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: subtitle-media-${{ matrix.target }}-${{ needs.plan.outputs.artifact_commit }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.source_run }}
          path: media-input
      - name: Inspect actual sources and executable, real encoded and burned captions
        run: python desktop/tests/media_smoke.py media-input/${{ matrix.target }}.tar.gz
        env:
          SOURCE_MEDIA_COMMIT: ${{ needs.plan.outputs.artifact_commit }}
      - name: Preserve independent media evidence
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-media-evidence-${{ matrix.target }}-${{ github.sha }}
          path: desktop/evidence/media-${{ matrix.target }}.json
          if-no-files-found: error
